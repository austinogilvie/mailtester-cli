[project]
name = "mailtester-cli"
version = "0.3.0"
description = "Command-line client for the MailTester email verification API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "austin", email = "austinogilvie@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/austinogilvie/mailtester-cli"
Repository = "https://github.com/austinogilvie/mailtester-cli"
Changelog = "https://github.com/austinogilvie/mailtester-cli/blob/main/CHANGELOG.md"

[project.scripts]
mailtester = "mailtester_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# Keep ruff out of Markdown code blocks; the README aligns its comments by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
